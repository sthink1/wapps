<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="only light">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Wonderful Apps - Forgot Password</title>
  <link rel="stylesheet" href="css/wa-buttons.css">
  <style>
    :root { color-scheme: only light; }
    body { font-family: Arial, sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; background-color:#f4f4f4; }
    .form-container { background:#fff; width:min(420px,calc(100% - 48px)); padding:20px; border-radius:8px; box-shadow:0 2px 10px rgba(0,0,0,.1); }
    h2 { margin-top:0; }
    label { display:block; margin-top:12px; }
    input { width:100%; padding:12px 20px; margin:8px 0; box-sizing:border-box; border:1px solid #ccc; border-radius:4px; font:inherit; }
    button { background:#4CAF50; color:#fff; padding:14px 20px; margin:8px 0; border:0; cursor:pointer; width:100%; border-radius:4px; font:inherit; }
    button:hover {background:#45a049;} button:disabled { opacity:.6; cursor:wait; }
    .password-row { display:flex; align-items:center; gap:8px; }
    .password-row input { flex:1; min-width:0; }
    .password-row button { width:auto; padding:10px 12px; white-space:nowrap; }
    .message { margin:10px 0; min-height:1.3em; } .error {color:#b00020;} .success {color:#176331;}
    .hidden {display:none;} .return {display:block; text-align:center; margin-top:12px;}
    .help { color:#555; line-height:1.45; }
  </style>
</head>
<body class="wa-raised-buttons">
  <main class="form-container">
    <h2 id="pageTitle">Forgot Password</h2>
    <section id="requestSection">
      <p class="help">Enter the email address associated with your Wonderful Apps account. If an account matches, password reset instructions will be sent.</p>
      <form id="requestForm">
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" autocomplete="email" maxlength="254" required>
        <button type="submit" id="requestButton">Send Reset Instructions</button>
      </form>
      <p id="requestMessage" class="message" role="status" aria-live="polite"></p>
    </section>
    <section id="resetSection" class="hidden">
      <p id="resetInstructions" class="help hidden">Enter a new password of at least eight characters. After resetting your password, sign in again.</p>
      <form id="resetForm">
        <label for="newPassword">New Password:</label>
        <div class="password-row"><input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8" required><button type="button" id="showPassword">Show</button></div>
        <label for="confirmPassword">Confirm New Password:</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required>
        <button type="submit" id="resetButton">Reset Password</button>
      </form>
      <p id="resetMessage" class="message" role="status" aria-live="polite"></p>
    </section>
    <a id="newResetLink" class="return hidden" href="forgotPassWord.html">Request New Reset Link</a>
    <a class="return" href="login.html">Back to Login</a>
  </main>
  <script>
    'use strict';
    const requestSection=document.getElementById('requestSection');
    const resetSection=document.getElementById('resetSection');
    const params=new URLSearchParams(location.search);
    let resetToken=params.get('token');
    // Avoid leaving the sensitive one-time token visible in browser history/address bar.
    if(params.has('token')) history.replaceState(null,'',location.pathname);
    const looksValid=typeof resetToken==='string' && /^[a-f0-9]{96}$/.test(resetToken);
    function invalidLink(message){
      resetToken=null;
      document.getElementById('resetForm').classList.add('hidden');
      document.getElementById('resetInstructions').classList.add('hidden');
      document.getElementById('newResetLink').classList.remove('hidden');
      setMessage('resetMessage',message||'This password-reset link is no longer valid. It may have expired, already been used, or been replaced by a newer link.',true);
    }
    if(params.has('token')){
      requestSection.classList.add('hidden');
      resetSection.classList.remove('hidden');
      document.getElementById('pageTitle').textContent='Reset Password';
      // Do not show password fields while server-side status is unknown.
      document.getElementById('resetForm').classList.add('hidden');
      if(!looksValid){invalidLink();}
      else{
        setMessage('resetMessage','Checking password-reset link...',false);
        (async()=>{
          try{
            const result=await post('/users/validate-reset-token',{token:resetToken});
            if(result.ok && result.data.valid===true){
              setMessage('resetMessage','',false);
              document.getElementById('resetInstructions').classList.remove('hidden');
              document.getElementById('resetForm').classList.remove('hidden');
            }else if(result.status===401){invalidLink();}
            else{
              resetToken=null;
              setMessage('resetMessage','Unable to verify this link right now. Please reopen the link later.',true);
            }
          }catch(_){
            resetToken=null;
            setMessage('resetMessage','Unable to contact the server. Please reopen the link later.',true);
          }
        })();
      }
    }
    function setMessage(id,message,error){const el=document.getElementById(id);el.className='message '+(error?'error':'success');el.textContent=message;}
    async function post(url,payload){
      const res=await fetch(url,{method:'POST',credentials:'same-origin',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      let data={};try{data=await res.json();}catch(_){}
      return {ok:res.ok,status:res.status,data};
    }
    document.getElementById('requestForm').addEventListener('submit',async e=>{
      e.preventDefault();const btn=document.getElementById('requestButton');btn.disabled=true;setMessage('requestMessage','',false);
      try{
        const response=await post('/users/forgot-password',{email:document.getElementById('email').value.trim()});
        if(response.ok){
          setMessage('requestMessage',response.data.message||'If an account matches, password reset instructions will be sent.',false);
        }else{setMessage('requestMessage','Unable to process the request right now. Please try again later.',true);}
      }catch(_){setMessage('requestMessage','Unable to contact the server. Please try again later.',true);}
      finally{btn.disabled=false;}
    });
    document.getElementById('showPassword').addEventListener('click',()=>{
      const a=document.getElementById('newPassword'),b=document.getElementById('confirmPassword'),next=a.type==='password'?'text':'password';
      a.type=next;b.type=next;document.getElementById('showPassword').textContent=next==='password'?'Show':'Hide';
    });
    document.getElementById('resetForm').addEventListener('submit',async e=>{
      e.preventDefault();if(!resetToken)return;
      const password=document.getElementById('newPassword').value;
      const confirmation=document.getElementById('confirmPassword').value;
      if(password.length<8||password!==confirmation){setMessage('resetMessage','Passwords must match and contain at least eight characters.',true);return;}
      const btn=document.getElementById('resetButton');btn.disabled=true;setMessage('resetMessage','',false);
      try{
        const response=await post('/users/reset-password',{token:resetToken,newPassword:password,confirmPassword:confirmation});
        if(response.ok){
          resetToken=null;document.getElementById('resetForm').reset();document.getElementById('resetForm').classList.add('hidden');document.getElementById('resetInstructions').classList.add('hidden');
          setMessage('resetMessage','Password reset successful. Please return to Login and sign in with your new password.',false);
        }else if(response.status===401){invalidLink();}
        else{setMessage('resetMessage',response.data.error||'Unable to reset password. Please try again.',true);}
      }catch(_){setMessage('resetMessage','Unable to contact the server. Please try again later.',true);}
      finally{btn.disabled=false;}
    });
  </script>
</body>
</html>
