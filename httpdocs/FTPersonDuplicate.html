<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Tree - Duplicate Person Review</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f4f4f4;padding:12px 8px 48px}.shell{width:min(980px,100%);margin:auto;background:#fff;border:1px solid #aaa}.head{text-align:center;padding:10px}.main{background:#98cfe2;padding:12px}.card{background:#fff;border:1px solid #aaa;padding:12px;margin-bottom:10px}.person-grid{display:grid;grid-template-columns:160px 1fr;gap:12px}.profile{width:145px;height:170px;object-fit:contain;border:1px solid #bbb;background:#fafafa}.facts{display:grid;grid-template-columns:150px 1fr;gap:5px}.rel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.relbox{border:1px solid #bbb;padding:8px}.pictures{display:flex;gap:8px;flex-wrap:wrap}.pictures img{width:130px;height:120px;object-fit:contain;border:1px solid #bbb;background:#fafafa}.btn,button{border:1px solid #8ba5c7;background:#d7e7fb;padding:7px 12px;cursor:pointer}.status{font-weight:bold}footer{position:fixed;bottom:0;left:0;width:100%;background:#ddd;text-align:center;padding:6px}@media(max-width:700px){.person-grid,.rel{grid-template-columns:1fr}}</style></head><body><div class="shell"><div class="head"><h1>PERSON — DUPLICATE REVIEW</h1><button onclick="window.close()">CLOSE</button> <button type="button" onclick="window.location.href='FamilyTree.html'">FAMILY TREE</button></div><div class="main"><div id="personCard" class="card"></div><div class="card"><h2>Family Relationships</h2><div class="rel"><div class="relbox"><h3>Parents</h3><div id="parents"></div></div><div class="relbox"><h3>Partners</h3><div id="partners"></div></div><div class="relbox"><h3>Children</h3><div id="children"></div></div></div></div><div class="card"><h2>Pictures</h2><div id="pictures" class="pictures"></div></div><div id="status" class="status"></div></div></div><footer>Copyright © 2026 Wonderful Apps Company - All Rights Reserved | Designed by MPG Jr</footer><script src="js/FTPersonDuplicate.js?v=20260902-1"></script></body></html>
