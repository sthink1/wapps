<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <title>Family Network Verification</title>
  <style>
    :root {
      color-scheme: only light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f4f4f4;
      padding: 28px 12px;
    }

    .card {
      max-width: 650px;
      margin: auto;
      background: #fff;
      border: 1px solid #bbb;
      border-radius: 7px;
      padding: 22px;
    }

    h1 {
      text-align: center;
    }

    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 4px;
      padding: 11px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    .approve {
      background: #4CAF50;
      color: #fff;
    }

    .decline {
      background: #b42318;
      color: #fff;
    }

    .neutral {
      background: #d7e7fb;
      color: #111;
    }

    .status {
      margin-top: 18px;
      font-weight: bold;
      line-height: 1.5;
    }

    .small {
      color: #555;
      line-height: 1.5;
    }
  </style>
    <link rel="stylesheet" href="css/wa-buttons.css">
</head>
<body class="wa-raised-buttons">
  <main class="card">
    <h1>FAMILY NETWORK VERIFICATION</h1>

    <p id="intro" class="small">Checking this verification request...</p>

    <div id="actions" class="actions" style="display: none;">
      <button id="approveBtn" class="approve" type="button">
        YES — INCLUDE ME IN FAMILY NETWORK
      </button>
      <button id="declineBtn" class="decline" type="button">
        NO — DO NOT INCLUDE ME
      </button>
    </div>

    <div id="status" class="status"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token') || '';
    const requestedChoice = String(params.get('choice') || '').toUpperCase();

    const intro = document.getElementById('intro');
    const actions = document.getElementById('actions');
    const approveBtn = document.getElementById('approveBtn');
    const declineBtn = document.getElementById('declineBtn');
    const statusEl = document.getElementById('status');

    let personName = '';
    let familyTreeCode = '';

    function showChoiceButtons() {
      actions.style.display = 'flex';

      if (requestedChoice === 'APPROVED') {
        approveBtn.textContent = 'CONFIRM YES — INCLUDE ME IN FAMILY NETWORK';
        approveBtn.style.display = '';
        declineBtn.style.display = 'none';
        return;
      }

      if (requestedChoice === 'DECLINED') {
        declineBtn.textContent = 'CONFIRM NO — DO NOT INCLUDE ME';
        declineBtn.style.display = '';
        approveBtn.style.display = 'none';
        return;
      }

      approveBtn.textContent = 'YES — INCLUDE ME IN FAMILY NETWORK';
      declineBtn.textContent = 'NO — DO NOT INCLUDE ME';
      approveBtn.style.display = '';
      declineBtn.style.display = '';
    }

    function verificationPrompt() {
      if (requestedChoice === 'APPROVED') {
        return `Please confirm that you want ${personName} to be included in Family Network searches for FamilyTreeCode ${familyTreeCode}.`;
      }

      if (requestedChoice === 'DECLINED') {
        return `Please confirm that you do not want ${personName} to be included in Family Network searches for FamilyTreeCode ${familyTreeCode}.`;
      }

      return `Wonderful Apps was asked to include ${personName} in the Family Network for FamilyTreeCode ${familyTreeCode}. Family Network is visible only within that Family Tree. Choose YES only if you want this Person to appear in Family Network searches.`;
    }

    async function load() {
      if (!token) {
        statusEl.textContent = 'This verification link is not valid.';
        return;
      }

      const response = await fetch(
        `/notifications/network-verification/${encodeURIComponent(token)}`
      );
      const data = await response.json();

      if (!response.ok) {
        statusEl.textContent =
          data.message || 'This verification link is not valid.';
        return;
      }

      personName = data.personName;
      familyTreeCode = data.familyTreeCode;
      intro.textContent = verificationPrompt();

      if (data.responded) {
        statusEl.textContent =
          data.response === 'APPROVED'
            ? 'This request was already approved.'
            : 'This request was already declined.';
        return;
      }

      showChoiceButtons();
    }

    async function respond(responseValue) {
      actions.style.display = 'none';
      statusEl.textContent = 'Saving your response...';

      const response = await fetch(
        `/notifications/network-verification/${encodeURIComponent(token)}`,
        {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            response: responseValue
          })
        }
      );

      const data = await response.json();
      statusEl.textContent =
        data.message || 'Your response has been recorded.';
    }

    approveBtn.addEventListener('click', () => respond('APPROVED'));
    declineBtn.addEventListener('click', () => respond('DECLINED'));

    load().catch((error) => {
      statusEl.textContent = error.message;
    });
  </script>
</body>
</html>
