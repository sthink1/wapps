<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wonderful Apps - Family Tree</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>

        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background-color: #f4f4f4;
            padding: 20px 12px 55px;
        }
        .page-shell {
            width: min(760px, 100%);
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
            overflow: hidden;
        }
        header {
            text-align: center;
            padding: 18px 20px 10px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }
        .nav-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        button, .button-link {
            appearance: none;
            border: 0;
            border-radius: 4px;
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .button-link:hover { background: #45a049; }
        button.secondary, .button-link.secondary { background: #777; }
        button.secondary:hover, .button-link.secondary:hover { background: #666; }
        button:disabled { opacity: .55; cursor: not-allowed; }
        main {
            background: aqua;
            padding: 24px;
            min-height: 300px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 18px;
            margin: 0 auto 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
        }
        .status {
            min-height: 24px;
            margin-top: 12px;
            font-weight: bold;
        }
        .error { color: #a00000; }
        .success { color: #116611; }
        footer {
            background-color: lightgray;
            min-height: 35px;
            padding: 6px 8px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
        }
        footer table {
            width: min(760px, 100%);
            margin: 0 auto;
            border-collapse: collapse;
        }
        footer td { text-align: center; }
        @media (max-width: 560px) {
            main { padding: 16px 10px; }
            h1 { font-size: 26px; }
            footer td { display: block; border: 0 !important; }
        }

        .menu-buttons {
            display: grid;
            gap: 14px;
            max-width: 360px;
            margin: 0 auto;
        }
        .menu-buttons button {
            width: 100%;
            font-size: 18px;
            padding: 13px 20px;
        }
        .tree-code {
            text-align: center;
            margin-bottom: 18px;
        }
        .tree-code strong {
            display: block;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header>
            <h1>FAMILY TREE</h1>
            <div class="nav-row">
                <a class="button-link secondary" href="home.html">HOME</a>
            </div>
        </header>

        <main>
            <section class="card">
                <div class="tree-code">
                    <strong>FamilyTreeCode</strong>
                    <span id="familyTreeCodeDisplay">No Family Tree selected</span>
                </div>

                <div class="menu-buttons">
                    <button type="button" data-page="FTPersonNew.html">NEW PERSON</button>
                    <button type="button" data-page="FTPersonList.html">PERSON LIST</button>
                    <button type="button" id="searchBtn" disabled title="Advanced FamilyTree search will be added in the next development step.">
                        SEARCH
                    </button>
                </div>

                <div id="statusMessage" class="status" aria-live="polite"></div>
            </section>
        </main>
    </div>


    <footer>
        <table>
            <tr>
                <td>Copyright © 2026 Wonderful Apps Company - All Rights Reserved</td>
                <td style="text-align:center; border:1px solid black;">Designed by MPG Jr</td>
            </tr>
        </table>
    </footer>

    <script src="js/FamilyTree.js"></script>
</body>
</html>
