<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="only light">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="referrer" content="no-referrer">
  <title>Wonderful Apps - Change Password</title>
  <link rel="stylesheet" href="css/wa-buttons.css">
  <style>
    :root {color-scheme:only light}
    body {font-family:Arial,sans-serif;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;background:#f4f4f4}
    main {background:white;box-sizing:border-box;width:min(440px,calc(100% - 36px));padding:24px;border-radius:9px;box-shadow:0 3px 12px #0002}
    h1 {font-size:1.5rem;margin:0 0 12px}
    label {display:block;margin:15px 0 5px}
    input {box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #999;border-radius:4px}
    button {font:inherit;cursor:pointer;background:#4caf50;color:white;padding:12px 15px;border:0;border-radius:5px}
    button:disabled {opacity:.65;cursor:wait}
    .actions {display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
    .actions button {flex:1}
    #toggle {background:#555;padding:7px 12px;margin-top:8px}
    #status {min-height:1.5em;margin-top:15px;line-height:1.4}
    #status.error {color:#a00020}
    #status.success {color:#166534}
    .help {color:#555;font-size:.95rem;line-height:1.5}
    a {display:inline-block;margin-top:14px}
  </style>
</head>
<body class="wa-raised-buttons">
<main>
  <h1>Change Password</h1>
  <p id="introduction" class="help">Enter your current password and a different new password of at least 8 characters. Changing your password will sign you out of all devices.</p>
  <form id="changeForm" hidden>
    <label for="current">Current Password</label>
    <input id="current" type="password" autocomplete="current-password" required>
    <label for="next">New Password</label>
    <input id="next" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm">Confirm New Password</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="8" required>
    <button type="button" id="toggle">Show passwords</button>
    <div class="actions"><button type="submit" id="submit">Change Password</button></div>
  </form>
  <div id="status" role="status" aria-live="polite">Checking your login…</div>
  <a id="returnLink" href="home.html">Return to Home</a>
</main>
<script>
'use strict';
const form=document.getElementById('changeForm');
const status=document.getElementById('status');
const submit=document.getElementById('submit');
const fields=['current','next','confirm'].map(id=>document.getElementById(id));
const token=localStorage.getItem('token');
function message(value,error=false){status.textContent=value;status.className=error?'error':'success';}
function clearLogin(){localStorage.removeItem('token');}
function redirectToLogin(){window.location.replace('login.html');}
async function verifySession(){
  if(!token){redirectToLogin();return;}
  try{
    const response=await fetch('/users/session-status',{headers:{Authorization:`Bearer ${token}`},credentials:'same-origin',cache:'no-store'});
    if(response.status===401||response.status===403){clearLogin();redirectToLogin();return;}
    if(!response.ok)throw Error('Unable to verify your session right now.');
    const data=await response.json();
    if(data.authenticated!==true||data.client!=='web'){clearLogin();redirectToLogin();return;}
    form.hidden=false;message('');
  }catch(_){message('Unable to verify your login. Try again shortly.',true);}
}
document.getElementById('toggle').addEventListener('click',()=>{
  const show=fields[0].type==='password';
  for(const field of fields)field.type=show?'text':'password';
  document.getElementById('toggle').textContent=show?'Hide passwords':'Show passwords';
});
form.addEventListener('submit',async event=>{
  event.preventDefault();
  const [currentPassword,newPassword,confirmPassword]=fields.map(el=>el.value);
  if(newPassword.length<8||newPassword!==confirmPassword){message('New passwords must match and have at least 8 characters.',true);return;}
  if(newPassword===currentPassword){message('The new password must be different.',true);return;}
  submit.disabled=true;message('Submitting password change…');
  try{
    const response=await fetch('/users/change-password',{
      method:'POST',credentials:'same-origin',cache:'no-store',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${token}`},
      body:JSON.stringify({currentPassword,newPassword,confirmPassword})
    });
    let data={};try{data=await response.json();}catch(_){ }
    if(response.ok){
      clearLogin();form.reset();form.hidden=true;document.getElementById('introduction').hidden=true;const back=document.getElementById('returnLink');back.href='login.html';back.textContent='Return to Login';
      message('Password changed successfully. All existing sessions have been revoked. Please return to Login and sign in with the new password.');
      return;
    }
    if(response.status===401||response.status===403){
      if(response.status===401 && data.error==='Incorrect current password.'){
        message('Incorrect current password.',true);return;
      }
      clearLogin();form.hidden=true;message('Your session is no longer valid. Please sign in again.',true);return;
    }
    message(data.error||'Unable to change password. No success was confirmed.',true);
  }catch(_){message('Unable to reach the server. Check your connection before trying again.',true);}
  finally{submit.disabled=false;}
});
verifySession();
</script>
</body>
</html>
