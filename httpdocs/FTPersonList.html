<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Tree - Person List</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;min-height:100vh;background:#f4f4f4;padding:18px 10px 58px}.page-shell{width:min(1000px,100%);margin:0 auto;background:#fff;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.12);overflow:hidden}header{text-align:center;padding:16px 18px 10px}h1{margin:0 0 10px}h2{margin:0 0 12px;font-size:20px}.nav-row,.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button,.button-link{border:0;border-radius:4px;background:#4CAF50;color:white;padding:9px 16px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}button:hover,.button-link:hover{background:#45a049}.secondary{background:#777!important}button:disabled{opacity:.5;cursor:not-allowed}main{background:aqua;padding:18px;min-height:360px}.card{background:#fff;border-radius:7px;padding:16px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.12)}.status{min-height:22px;margin-top:10px;font-weight:bold}.error{color:#9b0000}.success{color:#086008}.small-note{color:#555;font-size:13px}code.code-display{display:inline-block;font-size:18px;background:#f0f0f0;padding:5px 9px;border-radius:4px}footer{background:lightgray;min-height:34px;padding:6px;position:fixed;bottom:0;left:0;width:100%;text-align:center}footer table{width:min(1000px,100%);margin:0 auto;border-collapse:collapse}footer td{text-align:center}@media(max-width:600px){main{padding:10px}footer td{display:block;border:0!important}}.tools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.tools input{padding:9px;border:1px solid #aaa;border-radius:4px}.wrap{overflow:auto}table.person-table{width:100%;border-collapse:collapse;background:#fff}.person-table th,.person-table td{border:1px solid #ccc;padding:7px 8px;text-align:left;white-space:nowrap}.person-table th{background:#eee}</style></head><body><div class="page-shell"><header><h1>PERSON LIST</h1><div class="nav-row"><a class="button-link secondary" href="FamilyTree.html">BACK</a><a class="button-link" href="FTPersonNew.html">NEW PERSON</a></div></header><main><section class="card"><div class="tools"><input id="filterInput" type="search" placeholder="Filter by name, date, place, or FamilyTreeCode"><button id="refreshBtn">REFRESH</button></div><div class="wrap"><table class="person-table"><thead><tr><th>PersonID</th><th>Name</th><th>Birth Date</th><th>Birth Place</th><th>Death Date</th><th>Oldest FamilyTreeCode</th></tr></thead><tbody id="personTableBody"><tr><td colspan="6">Loading...</td></tr></tbody></table></div><div id="statusMessage" class="status"></div></section></main></div><footer><table><tr><td>Copyright © 2026 Wonderful Apps Company - All Rights Reserved</td><td style="text-align:center;border:1px solid black">Designed by MPG Jr</td></tr></table></footer><script src="js/FTPersonList.js"></script></body></html>
