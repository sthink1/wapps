<!doctype html>
<html>
<head>
    <meta name="color-scheme" content="only light">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Family Tree - Person List</title>
    <style>
        :root {
            color-scheme: only light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 14px;
        }

        .shell {
            max-width: 1050px;
            margin: auto;
            background: #fff;
        }

        .head {
            text-align: center;
            padding: 12px;
        }

        .btn,
        button {
            padding: 7px 12px;
            background: #d7e7fb;
            border: 1px solid #8ba5c7;
            text-decoration: none;
            color: #111;
            cursor: pointer;
        }

        .main {
            background: #98cfe2;
            padding: 12px;
        }

        .tools {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            margin-bottom: 10px;
        }

        input {
            padding: 8px;
        }

        .split-notice {
            display: none;
            margin-bottom: 12px;
            padding: 10px;
            background: #fff3cd;
            border: 2px solid #b7791f;
            line-height: 1.4;
        }

        .tree-section {
            margin-bottom: 14px;
            padding: 10px;
            background: #fff;
            border: 1px solid #9aa7b4;
        }

        .tree-heading {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .tree-title {
            margin: 0;
            font-size: 18px;
        }

        .tree-code {
            font-weight: bold;
        }

        .current-label {
            font-weight: bold;
            color: #075f07;
        }

        .table-wrap {
            overflow: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }

        th,
        td {
            border: 1px solid #bbb;
            padding: 6px;
            text-align: left;
        }

        th {
            background: #d6dde8;
        }

        .status {
            font-weight: bold;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="head">
            <h1>PERSON LIST</h1>
            <p><b>Current FamilyTreeCode:</b> <span id="codeDisplay"></span></p>
            <button id="backBtn" type="button">BACK</button>
            <button type="button" onclick="window.location.href='FamilyTree.html'">FAMILY TREE</button>
            <a class="btn" href="FTPersonNew.html">NEW PERSON</a>
        </div>

        <div class="main">
            <div id="splitNotice" class="split-notice"></div>

            <div class="tools">
                <input id="filterInput" placeholder="Filter List">
                <button id="refreshBtn" type="button">REFRESH</button>
            </div>

            <div id="treeSections"></div>
            <div id="statusMessage" class="status"></div>
        </div>
    </div>

    <script src="js/FTPersonList.js?v=20260921-persistent-split3"></script>
</body>
</html>
