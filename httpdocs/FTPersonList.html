<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Tree - Person List</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>

        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background-color: #f4f4f4;
            padding: 20px 12px 55px;
        }
        .page-shell {
            width: min(760px, 100%);
            margin: 0 auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
            overflow: hidden;
        }
        header {
            text-align: center;
            padding: 18px 20px 10px;
        }
        h1 {
            margin: 0 0 12px;
            font-size: 30px;
        }
        .nav-row {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        button, .button-link {
            appearance: none;
            border: 0;
            border-radius: 4px;
            background: #4CAF50;
            color: white;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .button-link:hover { background: #45a049; }
        button.secondary, .button-link.secondary { background: #777; }
        button.secondary:hover, .button-link.secondary:hover { background: #666; }
        button:disabled { opacity: .55; cursor: not-allowed; }
        main {
            background: aqua;
            padding: 24px;
            min-height: 300px;
        }
        .card {
            background: white;
            border-radius: 8px;
            padding: 18px;
            margin: 0 auto 16px;
            box-shadow: 0 1px 4px rgba(0,0,0,.12);
        }
        .status {
            min-height: 24px;
            margin-top: 12px;
            font-weight: bold;
        }
        .error { color: #a00000; }
        .success { color: #116611; }
        footer {
            background-color: lightgray;
            min-height: 35px;
            padding: 6px 8px;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            text-align: center;
        }
        footer table {
            width: min(760px, 100%);
            margin: 0 auto;
            border-collapse: collapse;
        }
        footer td { text-align: center; }
        @media (max-width: 560px) {
            main { padding: 16px 10px; }
            h1 { font-size: 26px; }
            footer td { display: block; border: 0 !important; }
        }

        .list-tools {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 10px;
            margin-bottom: 14px;
        }
        .list-tools input {
            min-width: 0;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 4px;
        }
        .table-wrap {
            overflow-x: auto;
            background: white;
            border-radius: 6px;
        }
        table.person-table {
            width: 100%;
            border-collapse: collapse;
        }
        .person-table th,
        .person-table td {
            border: 1px solid #ccc;
            padding: 8px 9px;
            text-align: left;
            vertical-align: middle;
            white-space: nowrap;
        }
        .person-table th {
            background: #eee;
        }
        .person-table tbody tr:nth-child(even) {
            background: #f8f8f8;
        }
        .person-id-btn {
            padding: 6px 10px;
            font-size: 14px;
        }
        .empty-row {
            text-align: center !important;
            color: #555;
            padding: 18px !important;
        }
        @media (max-width: 520px) {
            .list-tools { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header>
            <h1>PERSON LIST</h1>
            <div class="nav-row">
                <a class="button-link secondary" href="FamilyTree.html">BACK</a>
                <a class="button-link" href="FTPersonNew.html">NEW PERSON</a>
            </div>
        </header>

        <main>
            <section class="card">
                <div class="list-tools">
                    <input id="filterInput" type="search" placeholder="Filter by name, date, or birth place" aria-label="Filter person list">
                    <button id="refreshBtn" type="button">REFRESH</button>
                </div>

                <div class="table-wrap">
                    <table class="person-table">
                        <thead>
                            <tr>
                                <th>PersonID</th>
                                <th>Name</th>
                                <th>Birth Date</th>
                                <th>Birth Place</th>
                                <th>Death Date</th>
                            </tr>
                        </thead>
                        <tbody id="personTableBody">
                            <tr><td colspan="5" class="empty-row">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>

                <div id="statusMessage" class="status" aria-live="polite"></div>
            </section>
        </main>
    </div>


    <footer>
        <table>
            <tr>
                <td>Copyright © 2026 Wonderful Apps Company - All Rights Reserved</td>
                <td style="text-align:center; border:1px solid black;">Designed by MPG Jr</td>
            </tr>
        </table>
    </footer>

    <script src="js/FTPersonList.js"></script>
</body>
</html>
