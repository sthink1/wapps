<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Family Tree Privacy Verification</title><style>body{font:16px Arial,sans-serif;background:#f4f4f4;margin:0;padding:35px 12px}main{max-width:580px;margin:auto;background:#fff;border:1px solid #aaa;border-radius:7px;padding:22px}button{padding:10px 18px;border:0;border-radius:4px;margin:8px;cursor:pointer}#approve{background:#4caf50;color:white}#decline{background:#b42318;color:white}button:disabled{opacity:.5}</style></head><body><main><h1>FAMILY TREE PRIVACY VERIFICATION</h1><p id="status">Checking your request...</p><button id="approve" disabled>APPROVE</button><button id="decline" disabled>DECLINE</button></main><script>
const token=new URLSearchParams(location.search).get('token')||'';const status=document.getElementById('status');const approve=document.getElementById('approve');const decline=document.getElementById('decline');
(async()=>{try{if(!/^[a-f0-9]{64}$/.test(token))throw Error('Invalid link.');const r=await fetch('/familytree/privacy-verify/'+token);const d=await r.json();status.textContent=d.message||'Request unavailable.';approve.disabled=decline.disabled=!d.valid;}catch(e){status.textContent=e.message;}})();
async function submit(decision){approve.disabled=decline.disabled=true;try{const r=await fetch('/familytree/privacy-verify/'+token,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision})});const d=await r.json();status.textContent=d.message||'Unable to process request.';}catch(e){status.textContent=e.message;}}
approve.onclick=()=>submit('APPROVE');decline.onclick=()=>submit('DECLINE');
</script></body></html>
