<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Wonderful Apps - Budget Loan Report</title><link rel="manifest" href="/manifest.json"><link rel="icon" href="/favicon.ico"><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f8e8d9;margin:0;padding:0 0 42px;color:#333}
.container{max-width:1000px;margin:20px auto;padding:20px;background:#fff;border-radius:10px;box-shadow:0 4px 8px rgba(0,0,0,.1)}
h1,h2,h3{text-align:center;color:#333;margin:10px 0}h1{font-size:34px}.page-header{padding-bottom:8px;margin-bottom:14px}
.header-actions,.form-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
button{padding:9px 18px;font-size:15px;background:#007bff;color:#fff;border:0;border-radius:5px;cursor:pointer}button:hover{background:#0056b3}
button.secondary{background:#6c757d}button.secondary:hover{background:#565e64}button.danger{background:#c82333}button.danger:hover{background:#a71d2a}button.small{padding:6px 10px;font-size:13px}
.section{padding:15px;border-radius:6px;margin-bottom:18px}.section-form{background:#e6f0fa}.section-records{background:#f5f5f5}
.instructions{background:#fff4cc;border:1px solid #e3c969;border-radius:5px;padding:10px 14px;margin:10px 0 16px;line-height:1.45}.instructions p{margin:5px 0}
.form-grid{display:grid;grid-template-columns:210px minmax(0,1fr);gap:10px 14px;align-items:center;max-width:790px;margin:0 auto}.form-grid label{font-weight:bold;text-align:right}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;padding:8px 9px;border:1px solid #bbb;border-radius:4px;font:inherit;background:#fff}textarea{min-height:78px;resize:vertical}input[readonly]{background:#f1f1f1}
.inline-control{display:flex;align-items:center;gap:8px}.inline-control>:first-child{flex:1}.check-wrap{display:flex;align-items:center;gap:8px}.check-wrap input{width:auto;transform:scale(1.15)}
.message{max-width:790px;margin:10px auto 0;padding:8px 10px;border-radius:4px;display:none}.message.show{display:block}.message.success{background:#e6f7e6;border:1px solid #8bc98b}.message.error{background:#fde7e9;border:1px solid #d99;color:#8a1f2d}
.table-shell{border:1px solid #ccc;border-radius:5px;overflow:auto;background:#fff}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border-right:1px solid #ddd;border-bottom:1px solid #ddd;padding:8px;text-align:center;vertical-align:middle;overflow-wrap:anywhere}th:last-child,td:last-child{border-right:none}thead th{background:#f2f2f2;font-weight:bold}
.scroll-body{max-height:310px;overflow-y:auto;overflow-x:auto}.scroll-body table{margin:0}.scroll-body tbody tr{cursor:pointer}.scroll-body tbody tr:hover{background:#eaf3ff}.scroll-body tbody tr.selected{background:#d9ebff}.empty-row{color:#777;cursor:default!important}.empty-row:hover{background:#fff!important}
.modal{display:none;position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,.45);overflow-y:auto;padding:30px 10px}.modal.show{display:block}.modal-content{background:#fff;width:min(720px,96vw);margin:0 auto;padding:20px;border-radius:10px;box-shadow:0 6px 18px rgba(0,0,0,.25)}.modal-content.narrow{width:min(500px,96vw)}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #ddd;margin-bottom:15px}.modal-top h2{flex:1}.close-x{font-size:28px;line-height:1;color:#777;cursor:pointer;padding:0 4px}
.frequency-grid{display:grid;grid-template-columns:170px minmax(0,1fr);gap:10px 12px;align-items:center}.frequency-grid>label{text-align:right;font-weight:bold}.pattern-box{margin-top:14px;background:#f5f5f5;border-radius:5px;padding:12px}.pattern-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}.pattern-row input[type=number]{width:85px}.pattern-row select{width:auto;min-width:150px}
.weekday-grid,.monthday-grid{display:grid;gap:6px;margin-top:8px}.weekday-grid{grid-template-columns:repeat(4,1fr)}.monthday-grid{grid-template-columns:repeat(8,1fr)}.weekday-grid label,.monthday-grid label{font-weight:normal;text-align:left;white-space:nowrap}
.range-box{margin-top:14px;background:#eef7ee;border-radius:5px;padding:12px}.preview{max-height:110px;overflow-y:auto;border:1px solid #ddd;padding:8px;margin-top:10px;background:#fff;font-size:13px}
footer{background:lightgray;height:30px;padding-top:5px;position:fixed;bottom:0;width:100%;text-align:center;z-index:20}footer table{width:460px;margin:0 auto;table-layout:auto}footer td{border:none;padding:2px 8px}
.report-controls{display:flex;justify-content:center;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0 15px}.report-controls select{width:180px}.report-table{min-width:900px}.report-table tbody tr{cursor:pointer}.report-table tbody tr:hover{background:#eaf3ff}
@media(max-width:720px){.container{margin:10px;padding:12px}.form-grid,.frequency-grid{grid-template-columns:1fr}.form-grid label,.frequency-grid>label{text-align:left}.weekday-grid{grid-template-columns:repeat(2,1fr)}.monthday-grid{grid-template-columns:repeat(4,1fr)}footer table{width:100%}}
</style></head><body><div class="container"><header class="page-header"><h1>Budget - Loan Report</h1><div class="header-actions"><button id="budgetBtn">Budget Page</button><button id="reportsBtn" class="secondary">Reports</button></div></header><section class="section section-records"><div class="report-controls"><label for="status"><strong>Show:</strong></label><select id="status"><option value="active">Active</option><option value="inactive">Inactive</option><option value="all">All</option></select></div><p style="text-align:center">Click a row to open the source form.</p><div class="table-shell"><div class="scroll-body" style="max-height:500px"><table class="report-table"><thead><tr><th>From</th><th>Date</th><th>Description</th><th>Loan Amount</th><th>Loan Amount Estimated</th><th>Payment Start Date</th><th>Payment End Date</th><th>Payment Amount</th><th>Payment Amount Estimated</th><th>Active</th></tr></thead><tbody id="reportBody"></tbody></table></div></div><div id="reportMessage" class="message"></div></section></div><footer><table><tr><td>Copyright © 2025 M P Galvin Jr</td><td style="text-align:center;border:1px solid black;">Designed by MPG Jr</td></tr></table></footer><script>
const BASE_URL=(window.location.hostname==='localhost'&&window.location.port!=='8080')?'http://localhost:8080':window.location.origin;
function getToken(){return localStorage.getItem('token')}
function requireLogin(){if(!getToken()){alert('You must be logged in to use the Budget application.');location.href='home.html';return false}return true}
async function apiFetch(path,options={}){const token=getToken();const response=await fetch(`${BASE_URL}${path}`,{...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(token?{'Authorization':`Bearer ${token}`} : {}),...(options.headers||{})}});let data=null;try{data=await response.json()}catch(_){}if(!response.ok){const m=(data&&(data.error||data.message))||`HTTP error ${response.status}`;throw new Error(String(m).replace(/\(be\)$/,''))}return data}
function moneyDisplay(v){return Math.round(Number(v||0)).toLocaleString('en-US',{maximumFractionDigits:0})}
function escapeHtml(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function requestedId(){const raw=new URLSearchParams(location.search).get('id');if(raw===null||raw==='')return null;const n=Number(raw);return Number.isInteger(n)&&n>0?n:'invalid'}
if('serviceWorker'in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(e=>console.error('Service Worker registration failed:',e)))}
function msg(t){const e=document.getElementById('reportMessage');e.textContent=t;e.className='message show error'}async function loadReport(){try{const rows=await apiFetch(`/budget/loans?status=${encodeURIComponent(document.getElementById('status').value)}`);const reportBody=document.getElementById('reportBody');reportBody.innerHTML='';if(!rows.length){reportBody.innerHTML='<tr class="empty-row"><td colspan="10">No Loan records match this selection.</td></tr>';return}rows.forEach(r=>{const tr=document.createElement('tr');tr.innerHTML=`<td>${escapeHtml(r.FromName||'')}</td><td>${escapeHtml(r.DateLoan||'')}</td><td>${escapeHtml(r.Description||'')}</td><td>${moneyDisplay(r.LoanAmount)}</td><td>${(Number(r.LoanAmountIsEstimated)?'Yes':'No')}</td><td>${escapeHtml(r.PaymentDateBegin||'')}</td><td>${escapeHtml(r.PaymentDateEnd||'')}</td><td>${moneyDisplay(r.PaymentAmount)}</td><td>${(Number(r.PaymentAmountIsEstimated)?'Yes':'No')}</td><td>${(Number(r.Active)?'Yes':'No')}</td>`;tr.addEventListener('click',()=>location.href='BloanForm.html?id='+encodeURIComponent(r.UserLoanID));reportBody.appendChild(tr)})}catch(e){msg(e.message)}}document.addEventListener('DOMContentLoaded',async()=>{if(!requireLogin())return;document.getElementById('budgetBtn').addEventListener('click',()=>location.href='budget.html');document.getElementById('reportsBtn').addEventListener('click',()=>location.href='Breports.html');document.getElementById('status').addEventListener('change',loadReport);await loadReport()});</script></body></html>
